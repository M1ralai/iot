[platformio]
src_dir = .
default_envs = mac_reader

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags =
    -I common

[env:mac_reader]
build_src_filter = -<*> +<tools/mac_reader/>

[env:node_d1_sensor]
build_src_filter = -<*> +<common/> +<node_d1_sensor/>

[env:node_d2_relay]
build_src_filter = -<*> +<common/> +<node_d2_relay/>

[env:node_d3_gateway]
build_src_filter = -<*> +<common/> +<node_d3_gateway/>

[env:protocol_test]
build_src_filter = -<*> +<common/> +<tools/protocol_test/>